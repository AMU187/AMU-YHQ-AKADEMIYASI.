services:
  - type: web
    name: yhq-academy-v24-yagona
    runtime: docker
    envVars:
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /data/yhq.sqlite3
    disk:
      name: yhq-data
      mountPath: /data
      sizeGB: 1
